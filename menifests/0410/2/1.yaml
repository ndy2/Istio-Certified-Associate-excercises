apiVersion: networking.istio.io/v1bea1
kind: VirtualService
metadata:
  name: vs
spec:
  hosts:
    - crossboarderpayment.com
  gateways:
    - my-gateway
  http:
    - match:
        - uri:
            prefix: /payment
      route:
        - destination:
            host: payment.payment-service
    - route:
        - destination:
            host: frontend.frontend-service
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: my-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - crossboarderpayment.com
