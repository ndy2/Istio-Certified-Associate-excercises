apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: notification
  namespace: default
spec:
  host: notification-service
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 1
        maxRequestsPerConnection: 1
  subsets:
    - name: default
      labels:
        version: v2
