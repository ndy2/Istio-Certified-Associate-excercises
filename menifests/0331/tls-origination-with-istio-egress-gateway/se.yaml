apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: httpbin-org-se
spec:
  hosts:
    - httpbin.org
  location: MESH_EXTERNAL
  ports:
    - number: 80
      name: http
      protocol: HTTP
    - number: 443
      name: https
      protocol: TLS
  resolution: DNS
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin-org-vs
spec:
  hosts:
    - httpbin.org
  gateways:
    - istio-egressgateway  # Egress Gateway를 통해 나가도록 설정
  http:
    - timeout: 2s
      match:
        - port: 80
      route:
        - destination:
            host: httpbin.org
            port:
              number: 443
          headers:
            request:
              set:
                Host: httpbin.org
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: istio-egressgateway
spec:
  selector:
    istio: egressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - httpbin.org
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: egress-tls
spec:
  host: httpbin.org
  trafficPolicy:
    tls:
      mode: SIMPLE  # Egress Gateway에서 TLS 적용
